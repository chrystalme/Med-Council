name: CI

# Testing pipeline. Runs on PRs targeting main/develop and on direct pushes
# to those branches so the same gates apply to both promotion paths.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform-shared-config-guard:
    name: Terraform shared-config guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # `var.secret_names` and `var.ar_repo` are shared between the dev and
      # prod workspaces — see terraform/imports.tf. If either is overridden in
      # a per-workspace tfvars file, the next apply on the workspace that
      # plans last drifts the other workspace's state. Block that at the PR.
      - name: Reject per-workspace overrides of shared variables
        run: |
          set -e
          if grep -E '^\s*(secret_names|ar_repo)\s*=' terraform/env/*.tfvars; then
            echo "::error::secret_names / ar_repo must live in variables.tf only — see imports.tf header."
            exit 1
          fi

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Lint runs but does not block — there is pre-existing lint debt from the
      # Next 16 / React 19 `react-hooks/set-state-in-effect` rule. Remove
      # `continue-on-error` once that debt is cleared.
      - name: Lint
        run: pnpm --filter web lint
        continue-on-error: true

      - name: Typecheck
        run: pnpm --filter web exec tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: pnpm --filter web build

  api:
    name: API (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen

      - name: Import check
        run: uv run python -c "from medai_api import main, auth, council; print('import ok')"

      # All tests under apps/api/tests/ stub network calls (Langfuse, OpenAI,
      # Resend, urllib) — verified by audit. Failures here block the merge.
      # Coverage runs alongside; the gate ratchets up only — never lower
      # the --fail-under floor, raise it as new modules get covered.
      # Source / omit config lives in pyproject.toml [tool.coverage.*].
      - name: Tests + coverage
        run: |
          uv run --with coverage python -m coverage run -m unittest discover tests -v
          uv run --with coverage python -m coverage report --fail-under=70
          uv run --with coverage python -m coverage xml -o coverage.xml

      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml
